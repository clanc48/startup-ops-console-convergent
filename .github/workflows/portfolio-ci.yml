name: Portfolio CI

on:
  push:
    branches: [main, portfolio-hardening-2026-08]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_portfolio_test
      SUPABASE_SERVICE_ROLE_KEY: portfolio-test-service-role-key
      ENABLE_AI: "false"
      WORKER_TOKEN: portfolio-test-worker-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint, typecheck, test, and build
        run: npm run verify
