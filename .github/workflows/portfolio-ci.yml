name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_portfolio_test
      SUPABASE_SERVICE_ROLE_KEY: portfolio-test-service-role-key
      ENABLE_AI: "false"
      WORKER_TOKEN: portfolio-test-worker-token
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Lint, typecheck, test, and build
        run: npm run verify
