name: Screenshot Capture 2026-10-17
on:
  push:
    branches: [media/screenshots-2026-10-17]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_screenshot_only
      SUPABASE_SERVICE_ROLE_KEY: portfolio-test-service-role-key
      ENABLE_AI: "false"
      WORKER_TOKEN: portfolio-test-worker-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Start archived portfolio sample
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/startup-ops.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/startup-ops.log
          exit 1
      - name: Capture authentic public/auth surface
        run: |
          mkdir -p screenshots
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,1000 --screenshot=screenshots/login-desktop.png http://127.0.0.1:3000/login
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=430,932 --screenshot=screenshots/login-mobile.png http://127.0.0.1:3000/login
      - uses: actions/upload-artifact@v4
        with:
          name: project-screenshots
          path: screenshots/
          if-no-files-found: error
